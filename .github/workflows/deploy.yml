name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages on every push to main
# (and on demand). Pages is already set to "GitHub Actions" as its source, so
# this workflow is what actually makes merges go live at
# https://fediphedee.github.io/good-movies/.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer deploy supersede an in-progress one, but never cancel a run
# half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build   # base path /good-movies/ comes from vite.config
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
